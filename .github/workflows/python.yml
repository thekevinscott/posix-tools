name: Python

on:
  pull_request:
    paths:
      - 'packages/python/**'
      - 'packages/rust/**'
      - '!packages/*/changelog.d/**'
      - '!packages/*/migrations.d/**'
      - '.github/workflows/python.yml'

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      # Pinned to match the ruff-pre-commit rev in .pre-commit-config.yaml.
      - run: uvx ruff@0.8.4 check .
      - run: uvx ruff@0.8.4 format --check .

  build:
    name: Build wheel + smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/rust
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install maturin
      - name: Build wheel
        run: maturin build --release -o dist
        working-directory: packages/python
      - name: Install wheel + smoke (--version)
        run: |
          python -m venv .venv
          .venv/bin/pip install packages/python/dist/*.whl
          .venv/bin/mynewproduct --version
