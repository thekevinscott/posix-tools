[build-system]
# maturin 1.15.0 rejects a bare `--interpreter 3.14` for bin bindings, which
# putitoutthere passes. Lift the cap once either side is fixed.
requires = ["maturin>=1.7,<1.15"]
build-backend = "maturin"

[project]
name = "mynewproduct"
dynamic = ["version"]
description = "A short, one-line description of your project."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kevin Scott", email = "me@thekevinscott.com" }]

[project.urls]
Repository = "https://github.com/thekevinscott/template-lib"

[tool.maturin]
manifest-path = "../rust/Cargo.toml"
bindings = "bin"

[tool.ruff.lint]
# Ruff's defaults (E4, E7, E9, F) plus TID252: imports are absolute, never
# relative (PEP 8). See docs/internals/python/style.md.
select = ["E4", "E7", "E9", "F", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
